<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Feedback Submissions</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#f7fafc;color:#111;padding:18px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #e2e8f0;padding:8px;text-align:left}
    th{background:#eef2ff}
    .controls{margin-bottom:12px}
  </style>
</head>
<body>
  <h2>Admin - Feedback Submissions</h2>
  <div class="controls">
    <label>Admin password: <input id="adminPass" type="password"></label>
    <button id="loadBtn">Load submissions</button>
  </div>
  <div id="message"></div>
  <div id="tableWrap"></div>

  <script>
    document.getElementById('loadBtn').addEventListener('click', async ()=>{
      const pass = document.getElementById('adminPass').value;
      if(!pass){ document.getElementById('message').textContent='Enter password'; return; }
      document.getElementById('message').textContent='Loading...';
      try{
        const res = await fetch('/api/admin/submissions', { headers: { 'x-admin-pass': pass } });
        if(!res.ok){ const err = await res.json().catch(()=>({message:'Failed'})); throw new Error(err.message||'Failed'); }
        const arr = await res.json();
        document.getElementById('message').textContent = `Loaded ${arr.length} submissions`;
        if(arr.length===0){ document.getElementById('tableWrap').innerHTML = '<p>No submissions found.</p>'; return; }
        const rows = arr.map(s => `<tr><td>${s.id}</td><td>${s.type}</td><td>${s.name||''}</td><td>${s.email||''}</td><td>${s.subject}</td><td>${s.message}</td><td>${s.attachment? '<a href="/data/uploads/'+s.attachment+'" target="_blank">download</a>':''}</td><td>${s.ip}</td><td>${s.createdAt}</td></tr>`).join('');
        document.getElementById('tableWrap').innerHTML = `<table><thead><tr><th>ID</th><th>Type</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Attachment</th><th>IP</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table>`;
      }catch(err){ document.getElementById('message').textContent = err.message || 'Error'; }
    });
  </script>
</body>
</html>
